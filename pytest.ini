[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
filterwarnings =
    ignore::RuntimeWarning
    ignore::DeprecationWarning
markers =
    live: hits live network market-data APIs
    requires_key: skip unless env API key is set
    slow: longer multi-horizon / bulk fetches
    options_tape: live option chain/quote tape (yfinance)
# Legacy integration modules import packages not present in this repo
# (transaction_costs.models, risk.advanced_metrics, etc.). Replacements live in
# tests/integration/test_live_strategy_paths.py and tests/live/.
addopts =
    -ra
    --strict-markers
    --ignore=tests/integration/test_pipeline.py
    --ignore=tests/integration/test_risk_metrics.py
    --ignore=tests/integration/test_transaction_costs.py
    --ignore=tests/integration/test_factor_models.py
